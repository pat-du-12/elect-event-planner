# Ajoute l'application à côté des services de la base (même réseau Docker).
services:
  ird-app:
    container_name: ird-app
    build:
      context: ${IRD_SOURCE}
      dockerfile: deploy/docker/Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
    depends_on:
      db:
        condition: service_started

  ird-https:
    container_name: ird-https
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    environment:
      IRD_HOTE: ${IRD_HOTE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${IRD_SOURCE}/deploy/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ird-caddy-data:/data
    depends_on:
      - ird-app

volumes:
  ird-caddy-data:
